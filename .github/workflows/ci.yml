name: Finculator Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Financial Math, Security & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run Core Financial Math & Security Tests
        run: npm test

      - name: Verify SEO & Prerendered HTML Generator
        run: node scripts/generate_seo_pages.js

      - name: Verify Legal & Brand Pages Generator
        run: node scripts/generate_legal_pages.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pillow

      - name: Verify Python Server Security & System Tests
        env:
          ADMIN_API_KEY: dev_adm_8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b
          SECRET_KEY: dev_sec_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          APP_ENV: development
        run: |
          python server.py &
          SERVER_PID=$!
          sleep 2
          python tests/test_auth_and_system.py
          kill $SERVER_PID
